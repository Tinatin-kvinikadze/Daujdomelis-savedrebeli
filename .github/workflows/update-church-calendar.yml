name: Update church calendar

on:
  schedule:
    - cron: "5 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch today's Georgian calendar
        run: |
          node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";

          const dateParts = new Intl.DateTimeFormat("en-CA", {
            timeZone: "Asia/Tbilisi",
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
          }).formatToParts(new Date());
          const date = Object.fromEntries(dateParts
            .filter(({ type }) => type !== "literal")
            .map(({ type, value }) => [type, Number(value)]));
          const dateKey = `${date.year}-${String(date.month).padStart(2, "0")}-${String(date.day).padStart(2, "0")}`;
          const calendarUrl = `https://sasoeba.ge/api/calendar-day/ka/mtskheturi-g-mtatsmindelis/${date.year}/${date.month}/${date.day}`;
          const response = await fetch(calendarUrl);
          if (!response.ok) throw new Error(`Calendar API returned ${response.status}`);

          const calendar = await response.json();
          const saints = (calendar.saints_desc || [])
            .map((entry) => entry
              .replace(/<[^>]*>/g, " ")
              .replace(/&nbsp;|&#160;/gi, " ")
              .replace(/&amp;/gi, "&")
              .replace(/&lt;/gi, "<")
              .replace(/&gt;/gi, ">")
              .replace(/&quot;/gi, '"')
              .replace(/&#39;|&apos;/gi, "'")
              .replace(/&#(\d+);/g, (_, code) => String.fromCodePoint(Number(code)))
              .replace(/&#x([\da-f]+);/gi, (_, code) => String.fromCodePoint(parseInt(code, 16)))
              .replace(/\s+/g, " ")
              .trim())
            .filter(Boolean)
            .join(" ");
          if (!saints) throw new Error(`No saints found for ${dateKey}`);

          const data = {
            date: calendar.date,
            saints,
            url: `https://sasoeba.ge/ka/kalendari/mtskheturi-g-mtatsmindelis/${dateKey.replaceAll("-", "/")}`,
          };
          await writeFile("church-calendar-data.js", `window.churchCalendarData = ${JSON.stringify(data, null, 2)};\n`);
          NODE
      - name: Commit updated calendar data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- church-calendar-data.js; then
            git add church-calendar-data.js
            git commit -m "Update daily church calendar"
            git push
          fi